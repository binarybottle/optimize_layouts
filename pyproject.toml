[tool.poetry]
name = "optimize_layouts"
version = "0.1.0"
description = "Layout optimization tool"
authors = ["Arno Klein"]
package-mode = false
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.15"
pandas = "^3.1.1"
pyyaml = "^6.0.3"
tqdm = "^4.70.1"
psutil = "^7.2.2"
matplotlib = "^3.11.2"
seaborn = "^0.13.2"
numba = "^0.68.1"
scikit-learn = "^1.9.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
